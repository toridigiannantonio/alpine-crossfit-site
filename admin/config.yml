# ----------------------------------------------------------------------
# Decap CMS configuration for Alpine CrossFit
# ----------------------------------------------------------------------
# Lisa logs in at https://alpinecrossfit.com/admin/ (Netlify Identity)
# and edits content here. Saving commits the change to GitHub via Git
# Gateway, which triggers a Netlify rebuild and republishes the site.
#
# Field labels are written in plain English so a non-developer can use
# this without needing to know what the underlying JSON-LD or template
# fields are called.
# ----------------------------------------------------------------------

backend:
  name: git-gateway
  branch: main

# Default location for new uploads. Per-field media_folder overrides
# this for organized subfolders (coaches/, members/, gym-photos/).
media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

site_url: https://alpinecrossfit.com
display_url: https://alpinecrossfit.com
logo_url: https://alpinecrossfit.com/assets/img/logo.png

# Lisa's edits commit straight to main and auto-publish. We can flip
# this on later if she wants a draft/review step before going live:
#   publish_mode: editorial_workflow

collections:

  # ====================================================================
  # GYM DETAILS — the single source of truth for prices, hours, address,
  # phone, wellness amenities and drive times.
  #
  # These used to be pasted by hand into eleven different pages. Now they
  # live in _data/gym.json, which _data/site.js reads and every page and
  # FAQ answer renders from. Change a price here and it changes on the
  # homepage price strip, the /pricing/ table, the FAQ answers that quote
  # it, and the schema.org offers — in one edit.
  # ====================================================================
  - name: "settings"
    label: "Gym details"
    label_singular: "Gym details"
    description: "Prices, hours, address, phone, wellness amenities, and drive times. Everything here appears in several places on the site at once."
    delete: false
    files:
      - file: "_data/gym.json"
        name: "gym"
        label: "Prices, hours & location"
        fields:
          - {label: "Internal note (don't edit)", name: "_comment", widget: "hidden"}

          - label: "Address"
            name: "address"
            widget: "object"
            fields:
              - {label: "Street", name: "street", widget: "string"}
              - {label: "City", name: "city", widget: "string"}
              - {label: "State", name: "region", widget: "string"}
              - {label: "ZIP", name: "postalCode", widget: "string"}
              - {label: "Country code", name: "country", widget: "hidden", default: "US"}

          - {label: "Phone (as displayed)", name: "phoneDisplay", widget: "string", hint: "e.g. (720) 964-1505"}
          - {label: "Phone (for tel: links)", name: "phone", widget: "string", hint: "e.g. +1-720-964-1505"}
          - {label: "Phone (for text links)", name: "phoneSms", widget: "string", hint: "e.g. +17209641505"}
          - {label: "Parking", name: "parking", widget: "string"}
          - {label: "Member access line", name: "memberAccess", widget: "string"}

          - label: "Staffed hours"
            name: "hoursDisplay"
            widget: "list"
            summary: "{{fields.days}} {{fields.time}}"
            fields:
              - {label: "Days", name: "days", widget: "string", hint: "e.g. Mon–Fri"}
              - {label: "Times", name: "time", widget: "string", hint: "e.g. 5:30 AM – 6:30 PM"}

          - label: "Wellness center amenities"
            name: "wellnessAmenities"
            widget: "list"
            field: {label: "Amenity", name: "amenity", widget: "string"}
            hint: "Lowercase, e.g. 'cold plunges'. These are joined into a sentence automatically wherever the wellness center is described."

          - label: "Membership tiers"
            name: "tiers"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - {label: "Tier name", name: "name", widget: "string"}
              - {label: "Price (as displayed)", name: "price", widget: "string", hint: "e.g. $199"}
              - {label: "Price (digits only, for Google)", name: "amount", widget: "string", hint: "e.g. 199 — no dollar sign"}
              - {label: "Per", name: "unit", widget: "string", default: "/month"}
              - {label: "Highlight as most popular?", name: "featured", widget: "boolean", default: false}
              - {label: "One-line summary", name: "summary", widget: "string", required: false}
              - {label: "What's included", name: "features", widget: "list", field: {label: "Item", name: "item", widget: "string"}}
              - {label: "What's NOT included (shown greyed out)", name: "excluded", widget: "list", required: false, field: {label: "Item", name: "item", widget: "string"}}
              - {label: "Button label", name: "ctaLabel", widget: "string"}
              - {label: "Button link", name: "ctaHref", widget: "string"}
              - {label: "Opens in a new tab?", name: "ctaExternal", widget: "boolean", default: false, required: false}
              - {label: "Secondary link label", name: "altCtaLabel", widget: "string", required: false}
              - {label: "Secondary link", name: "altCtaHref", widget: "string", required: false}

          - label: "Visit options (drop-in, week pass, free intro)"
            name: "visitOptions"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Price (as displayed)", name: "price", widget: "string"}
              - {label: "Price (digits only, for Google)", name: "amount", widget: "string"}
              - {label: "Per", name: "unit", widget: "string"}
              - {label: "Highlight?", name: "featured", widget: "boolean", default: false}
              - {label: "Best for", name: "bestFor", widget: "text"}
              - {label: "Button label", name: "ctaLabel", widget: "string"}
              - {label: "Button link", name: "ctaHref", widget: "string"}
              - {label: "Opens in a new tab?", name: "ctaExternal", widget: "boolean", default: false, required: false}

          - label: "Areas we serve (drive times)"
            name: "areas"
            widget: "list"
            summary: "{{fields.city}} — {{fields.time}}"
            hint: "These render as the 'Areas we serve' block on /visit/. They replaced five near-duplicate city landing pages, so please keep the drive times honest."
            fields:
              - {label: "City", name: "city", widget: "string"}
              - {label: "Drive time", name: "time", widget: "string", hint: "e.g. 10 min"}
              - {label: "Detail", name: "note", widget: "text"}

  # ====================================================================
  # IMAGE BLOCKS — preserved from the original CMS pattern
  # Hero photos that auto-swap on the homepage, about, and wellness
  # pages via /assets/js/images.js.
  # ====================================================================
  - name: "images"
    label: "Image Blocks"
    label_singular: "Image Block"
    description: "Quick way to swap the big hero photos on the homepage, about page, and wellness page without touching the rest of the page. Auto-publishes within a minute."
    delete: false
    files:
      - name: "homepage_hero"
        label: "Homepage Hero"
        file: "content/images/homepage_hero.json"
        fields:
          - {label: "Image", name: "image", widget: "image", media_folder: "/assets/img/uploads/gym-photos", hint: "Shows in the right half of the homepage hero section. Portrait orientation looks best."}
          - {label: "Alt text", name: "alt", widget: "string", default: "Alpine CrossFit member mid-lift in front of the Alpine mountain wall mural", hint: "One sentence describing the photo — helps with accessibility and SEO."}
      - name: "about_hero"
        label: "About Page Hero"
        file: "content/images/about_hero.json"
        fields:
          - {label: "Image", name: "image", widget: "image", media_folder: "/assets/img/uploads/gym-photos", hint: "Shows in the right half of the About page hero. Portrait or landscape both work."}
          - {label: "Alt text", name: "alt", widget: "string", default: "Alpine CrossFit members training during a coached class"}
      - name: "wellness_hero"
        label: "Wellness Page Hero"
        file: "content/images/wellness_hero.json"
        fields:
          - {label: "Image", name: "image", widget: "image", media_folder: "/assets/img/uploads/gym-photos", hint: "Shows in the right half of the Wellness Center page hero."}
          - {label: "Alt text", name: "alt", widget: "string", default: "Alpine member training during wellness center hours"}

  # ====================================================================
  # HOMEPAGE — rebuilt in the 2026 simplification.
  # Eleven sections became six. The pricing table, class schedule and FAQ
  # accordion are gone from here: they live on the pages that own them
  # (/pricing/, /schedule/, /faq/) and the homepage links to them. The
  # price strip renders from Gym details, so there is nothing to retype.
  # ====================================================================
  - name: "homepage"
    label: "Homepage"
    label_singular: "Homepage"
    description: "The main alpinecrossfit.com landing page. Six sections, each editable as a form."
    delete: false
    files:
      - file: "content/pages/homepage.md"
        name: "homepage"
        label: "Homepage"
        fields:
          - {label: "Browser title", name: "title", widget: "string", hint: "Shown in the browser tab and as the link in Google search results."}
          - {label: "Search snippet", name: "description", widget: "text", hint: "1–2 sentences shown under the title in Google. ~155 characters works best."}
          - {label: "Social share title", name: "ogTitle", widget: "string", required: false}
          - {label: "Social share description", name: "ogDescription", widget: "text", required: false}

          - label: "Announcement bar (optional)"
            name: "announcement"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - {label: "Bold lead-in", name: "eyebrow", widget: "string", required: false}
              - {label: "Message", name: "text", widget: "text"}
              - {label: "Link target", name: "href", widget: "string", required: false}
              - {label: "Link label", name: "linkLabel", widget: "string", required: false}

          - label: "1. Hero (top of page)"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Small text above the headline", name: "eyebrow", widget: "string", required: false}
              - {label: "Headline (HTML allowed)", name: "heading", widget: "string", hint: "Wrap accent words in <span class=\"accent\">...</span>."}
              - {label: "One-sentence summary", name: "dek", widget: "text", hint: "Keep this to ONE sentence. It sets the height of the whole first screen on a phone."}
              - label: "Secondary links"
                name: "links"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                hint: "These render as plain text links, not buttons. The one primary button ('Book a free intro') is added automatically on every page — you do not set it here."
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "Link", name: "href", widget: "string"}
              - label: "Trust strip items"
                name: "trustItems"
                widget: "list"
                required: false
                summary: "{{fields.text}}"
                fields:
                  - {label: "Type (leave blank, or 'stars')", name: "type", widget: "string", required: false}
                  - {label: "Text", name: "text", widget: "string", required: false}
              - label: "Hero image"
                name: "image"
                widget: "object"
                fields:
                  - {label: "Image", name: "src", widget: "image", media_folder: "/assets/img/uploads/gym-photos"}
                  - {label: "Alt text", name: "alt", widget: "string"}
                  - {label: "Image slot ID (don't change)", name: "slot", widget: "hidden"}

          - label: "Affiliation badges"
            name: "affiliations"
            widget: "list"
            required: false
            collapsed: true
            summary: "{{fields.alt}}"
            fields:
              - {label: "Badge image", name: "image", widget: "image"}
              - {label: "Alt text", name: "alt", widget: "string"}
              - {label: "Caption (HTML allowed)", name: "label", widget: "string"}

          - label: "2. Who Alpine is for + Getting started"
            name: "intro"
            widget: "object"
            hint: "These used to be two separate sections. They are one now."
            fields:
              - {label: "Small text above the headline", name: "eyebrow", widget: "string"}
              - {label: "Section headline", name: "heading", widget: "string"}
              - {label: "Paragraphs", name: "body", widget: "list", field: {label: "Paragraph", name: "para", widget: "text"}}
              - label: "Short bullet points"
                name: "cards"
                widget: "list"
                summary: "{{fields.heading}}"
                fields:
                  - {label: "Bold lead-in", name: "heading", widget: "string"}
                  - {label: "Rest of the line", name: "body", widget: "string"}
              - {label: "Steps column heading", name: "stepsHeading", widget: "string", required: false, default: "Getting started"}
              - label: "Numbered steps"
                name: "steps"
                widget: "list"
                summary: "{{fields.heading}}"
                fields:
                  - {label: "Bold lead-in", name: "heading", widget: "string"}
                  - {label: "Rest of the step", name: "body", widget: "text"}

          - label: "3. What we offer (link tiles)"
            name: "services"
            widget: "object"
            hint: "These render as compact tiles, not full cards. Keep the note to one short line."
            fields:
              - {label: "Small text above the headline", name: "eyebrow", widget: "string"}
              - {label: "Section headline", name: "heading", widget: "string"}
              - label: "Tiles"
                name: "items"
                widget: "list"
                summary: "{{fields.heading}}"
                fields:
                  - {label: "Title", name: "heading", widget: "string"}
                  - {label: "One-line note", name: "note", widget: "string"}
                  - {label: "Link", name: "link", widget: "string"}

          - label: "4. Pricing strip"
            name: "pricing"
            widget: "object"
            hint: "The prices themselves come from 'Gym details' — edit them there once and they update here, on /pricing/, and in the FAQ answers. This section only sets the wording around them."
            fields:
              - {label: "Small text above the headline", name: "eyebrow", widget: "string"}
              - {label: "Section headline", name: "heading", widget: "string"}
              - {label: "Note under the prices", name: "note", widget: "text", required: false}
              - label: "Link to the full pricing page"
                name: "moreLink"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "Link", name: "href", widget: "string", default: "/pricing/"}

          - label: "5. Proof (one review + stats)"
            name: "proof"
            widget: "object"
            hint: "One featured review, not three. The other reviews live on the pages that quote them."
            fields:
              - {label: "Small text above the headline", name: "eyebrow", widget: "string"}
              - {label: "Section headline", name: "heading", widget: "string"}
              - label: "Featured review"
                name: "featured"
                widget: "object"
                fields:
                  - {label: "Quote (no quotation marks needed)", name: "quote", widget: "text"}
                  - {label: "Who said it", name: "attribution", widget: "string"}
              - label: "Stat row"
                name: "stats"
                widget: "list"
                summary: "{{fields.value}} — {{fields.label}}"
                fields:
                  - {label: "Big number", name: "value", widget: "string"}
                  - {label: "Caption", name: "label", widget: "string"}

          - label: "6. Visit us"
            name: "visit"
            widget: "object"
            hint: "The address, hours and parking card renders automatically from 'Gym details'. This section only sets the heading and the sentence beside it."
            fields:
              - {label: "Small text above the headline", name: "eyebrow", widget: "string"}
              - {label: "Section headline", name: "heading", widget: "string"}
              - {label: "Paragraph beside the card", name: "body", widget: "text", required: false}

          - label: "Closing call to action"
            name: "finalCta"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Body", name: "body", widget: "text", required: false}

          # ----- Hidden technical fields -----
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/homepage.njk"}
          - {label: "Permalink", name: "permalink", widget: "hidden", default: "/"}
          - {label: "Canonical", name: "canonical", widget: "hidden"}
          - {label: "Social share image", name: "ogImage", widget: "hidden"}
          - {label: "OG type", name: "ogType", widget: "hidden", default: "website"}
          - {label: "Load images.js", name: "loadImagesScript", widget: "hidden", default: true}
          - {label: "Schema types", name: "schemaTypes", widget: "hidden", default: ["website", "organization", "healthclub"]}


  # ====================================================================
  # BLOG — folder collection. New posts auto-publish to /blog/<slug>/.
  # The layout and URL are set automatically (content/blog/blog.json),
  # so a post only needs a title, snippet, date, and body.
  # ====================================================================
  - name: "blog"
    label: "Blog"
    label_singular: "Blog post"
    description: "Blog posts — training tips, gym news, workout of the day. Each one becomes a page at /blog/<slug>/."
    folder: "content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title"]
    media_folder: "/assets/img/uploads/blog"
    public_folder: "/assets/img/uploads/blog"
    fields:
      - {label: "Title", name: "title", widget: "string", hint: "The post headline. Also shown in the browser tab and Google search results."}
      - {label: "Search snippet", name: "description", widget: "text", hint: "1–2 sentences shown under the post in the blog list and in Google. ~155 characters works best."}
      - {label: "Publish date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true}
      - {label: "Post body", name: "body", widget: "markdown", hint: "The post content. Use the rich-text editor or write Markdown directly."}

  # ====================================================================
  # COACHES & OWNERS — folder collection (Lisa can add new coaches)
  # ====================================================================
  - name: "coaches"
    label: "Coaches & Owners"
    label_singular: "Coach or Owner"
    description: "Individual bio pages for each coach and owner. Each one becomes a page at /coaches/<slug>/."
    folder: "content/coaches"
    create: true
    delete: false
    slug: "{{slug}}"
    summary: "{{name}}"
    media_folder: "/assets/img/uploads/coaches"
    public_folder: "/assets/img/uploads/coaches"
    fields:
      - {label: "Coach name", name: "name", widget: "string", hint: "Full first + last name."}
      - {label: "Role tagline", name: "credentialsLine", widget: "string", hint: "Shown under the name. e.g., 'Owner · CF-L2 · Former Pro Soccer Player · 4× CrossFit Quarterfinalist'"}
      - {label: "Bio paragraph", name: "bio", widget: "text", hint: "1–2 sentences shown in the hero section."}
      - label: "Credentials list"
        name: "credentials"
        widget: "list"
        summary: "{{fields.credential}}"
        field: {label: "Credential", name: "credential", widget: "string"}
      - label: "Athletic profile (optional)"
        name: "athlete"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - {label: "Section heading", name: "heading", widget: "string", default: "As an athlete"}
          - {label: "Body paragraph (HTML allowed)", name: "body", widget: "text"}
          - label: "Benchmark numbers"
            name: "benchmarks"
            widget: "list"
            summary: "{{fields.benchmark}}"
            field: {label: "Benchmark", name: "benchmark", widget: "string"}
            required: false
      - label: "Where to find this coach online (optional)"
        name: "findCoach"
        widget: "list"
        required: false
        summary: "{{fields.label}}"
        fields:
          - {label: "Link label", name: "label", widget: "string"}
          - {label: "URL", name: "href", widget: "string"}
      - {label: "Final CTA heading (optional)", name: "finalCtaHeading", widget: "string", required: false, hint: "Defaults to 'Train where {first name} trains.' if blank."}
      - {label: "Browser title", name: "title", widget: "string"}
      - {label: "Search snippet", name: "description", widget: "text"}
      - {label: "Display order on /coaches/ index", name: "order", widget: "number", default: 99, required: false, hint: "Lower numbers appear first."}
      # ----- Hidden technical fields -----
      - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/coach.njk"}
      - {label: "Canonical", name: "canonical", widget: "hidden"}
      - {label: "Permalink", name: "permalink", widget: "hidden"}
      - {label: "Person schema (auto-generated)", name: "personSchema", widget: "hidden"}

  # ====================================================================
  # PAGES — files collection (everything else: about, pricing, FAQ, etc.)
  # Each entry is one of the existing markdown files. Lisa edits them
  # but can't add new ones (those would need a new layout / template).
  # ====================================================================
  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    description: "All other site pages: About, Pricing, FAQ, Visit, Schedule, service pages (CrossFit, HYROX, Wellness, etc.), the HYROX race pages, and the Free Intro funnel."
    delete: false
    files:

      # ----- About -----
      - file: "content/pages/about.md"
        name: "about"
        label: "About page"
        fields:
          - {label: "FAQ block: small text above the heading", name: "faqEyebrow", widget: "string", required: false}
          - {label: "FAQ block: heading", name: "faqHeading", widget: "string", required: false}
          - label: "FAQ block: which questions to show"
            name: "faqIds"
            widget: "select"
            multiple: true
            required: false
            hint: "Pick from the canonical question set. The answers live in _data/faqs.js — each is written once and reused, and this page's Google FAQ markup is generated from exactly this list, so the two can never disagree. Keep page FAQs short and topical; /faq/ carries the full set."
            options:
              - {label: "Do I need to be in shape before I start?", value: "in-shape-first"}
              - {label: "How do I get started at Alpine?", value: "how-to-start"}
              - {label: "What is the No Sweat Intro?", value: "no-sweat-intro"}
              - {label: "What is the Foundations program?", value: "foundations"}
              - {label: "How long does Foundations take?", value: "foundations-length"}
              - {label: "Is Alpine good for beginners?", value: "good-for-beginners"}
              - {label: "How long until I see results?", value: "how-long-results"}
              - {label: "Do I need an appointment?", value: "need-appointment"}
              - {label: "What should I bring?", value: "what-to-bring"}
              - {label: "What happens in my first class?", value: "first-class"}
              - {label: "Can I watch a class before I join?", value: "watch-a-class"}
              - {label: "What if I'm brand new to CrossFit?", value: "brand-new"}
              - {label: "What is CrossFit?", value: "what-is-crossfit"}
              - {label: "Is CrossFit safe?", value: "is-crossfit-safe"}
              - {label: "Is CrossFit good for weight loss?", value: "crossfit-weight-loss"}
              - {label: "Is CrossFit good for women?", value: "crossfit-for-women"}
              - {label: "What's the difference between CrossFit and a regular gym?", value: "crossfit-vs-gym"}
              - {label: "How long is a class?", value: "class-length"}
              - {label: "How many people are in a class?", value: "class-size"}
              - {label: "How often should I come per week?", value: "how-often"}
              - {label: "Who writes the workouts?", value: "who-programs"}
              - {label: "Do you follow cycles in your programming?", value: "programming-cycles"}
              - {label: "Do I need experience to take a class?", value: "need-experience"}
              - {label: "Do you have Sunday classes?", value: "sunday-classes"}
              - {label: "How much does Alpine cost?", value: "how-much"}
              - {label: "Which membership should I pick?", value: "which-membership"}
              - {label: "Is Unlimited worth it at $199 a month?", value: "unlimited-worth-it"}
              - {label: "What's included in the $69 Open Gym tier?", value: "open-gym-included"}
              - {label: "How does the $999 Personal Training tier work?", value: "pt-tier"}
              - {label: "Is there a contract or initiation fee?", value: "contract"}
              - {label: "Can I freeze my membership?", value: "freeze"}
              - {label: "Do you offer military, first responder, or student discounts?", value: "discounts"}
              - {label: "How do I cancel?", value: "cancel"}
              - {label: "What payment methods do you accept?", value: "payment-methods"}
              - {label: "Can I buy a membership online without talking to anyone?", value: "buy-online"}
              - {label: "How does Alpine's pricing compare to other gyms?", value: "price-comparison"}
              - {label: "Can I drop in to a class?", value: "can-i-drop-in"}
              - {label: "Do I need to book a drop-in in advance?", value: "drop-in-advance"}
              - {label: "Is my first class free if I train at another affiliate?", value: "first-class-free"}
              - {label: "Does a drop-in include the wellness center?", value: "drop-in-wellness"}
              - {label: "I've never done CrossFit. Should I drop in?", value: "new-should-i-drop-in"}
              - {label: "What's in the wellness center?", value: "wellness-included"}
              - {label: "How does peptide therapy work?", value: "peptide-therapy"}
              - {label: "When is the wellness center open?", value: "wellness-hours"}
              - {label: "What is Prime Vitality?", value: "prime-vitality"}
              - {label: "Where can I train for HYROX near Denver?", value: "hyrox-where"}
              - {label: "What are the 8 stations in a HYROX race?", value: "hyrox-stations"}
